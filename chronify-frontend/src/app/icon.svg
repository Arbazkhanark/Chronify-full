<!-- src/app/icon.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="chronifyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1E293B" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#chronifyGrad)" filter="url(#shadow)" />

  <!-- Clock ring (outer C shape) -->
  <circle
    cx="32" cy="32" r="17"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-dasharray="80 27"
    transform="rotate(-45 32 32)"
  />

  <!-- Clock hands -->
  <line x1="32" y1="32" x2="32" y2="22" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <line x1="32" y1="32" x2="40" y2="32" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

  <!-- Center dot -->
  <circle cx="32" cy="32" r="2.5" fill="#FFFFFF" />
</svg>