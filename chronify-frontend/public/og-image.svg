<!-- public/og-image.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="ogTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)" />

  <!-- Decorative blobs -->
  <circle cx="1050" cy="120" r="240" fill="#FFFFFF" opacity="0.06" />
  <circle cx="180" cy="560" r="200" fill="#FFFFFF" opacity="0.06" />

  <!-- Logo icon (scaled) -->
  <g transform="translate(120 130)">
    <rect x="0" y="0" width="140" height="140" rx="36" fill="#FFFFFF" opacity="0.15" />
    <rect x="0" y="0" width="140" height="140" rx="36" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.3" />

    <circle cx="70" cy="70" r="42" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-dasharray="198 66" transform="rotate(-45 70 70)" />
    <line x1="70" y1="70" x2="70" y2="46" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
    <line x1="70" y1="70" x2="90" y2="70" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
    <circle cx="70" cy="70" r="6" fill="#FFFFFF" />
  </g>

  <!-- Big wordmark -->
  <text
    x="300" y="215"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="96"
    font-weight="900"
    letter-spacing="-3"
    fill="url(#ogTextGrad)"
  >Chronify</text>

  <!-- Tagline -->
  <text
    x="304" y="290"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="36"
    font-weight="500"
    fill="#FFFFFF"
    opacity="0.9"
  >Plan your time. Build better habits.</text>

  <!-- Feature pills -->
  <g transform="translate(300 380)">
    <rect x="0" y="0" width="200" height="56" rx="28" fill="#FFFFFF" opacity="0.18" />
    <text x="100" y="36" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF">📅 Timetable</text>

    <rect x="220" y="0" width="220" height="56" rx="28" fill="#FFFFFF" opacity="0.18" />
    <text x="330" y="36" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF">🎯 Goals</text>

    <rect x="460" y="0" width="200" height="56" rx="28" fill="#FFFFFF" opacity="0.18" />
    <text x="560" y="36" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF">🔥 Streaks</text>
  </g>

  <!-- Bottom URL -->
  <text
    x="120" y="560"
    font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="28"
    font-weight="600"
    fill="#FFFFFF"
    opacity="0.85"
  >chronify.app</text>
</svg>